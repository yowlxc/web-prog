<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление студентами</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="favicon/cat.png">
</head>
<body>
    <h1>Система заявок: Мониторинг студентов</h1>

    <!-- Панель авторизованного пользователя -->
    <div id="session-bar" class="session-bar hidden">
        <span id="current-user"></span>
        <button type="button" id="btn-logout">Выйти</button>
    </div>

        <!-- Список студентов -->
        <section id="list-students" class="hidden">
            <div class="btn-add">
                <button id="btn-add">+ Добавить студента</button>
            </div>
            <div id="app-message" class="app-message hidden" role="alert" aria-live="polite"></div>

            <div class="students-content">

                <aside class="filters">
                    <h2>Фильтры</h2>

                    <div class="filter-item">
                        <label for="filter-fio">ФИО</label>
                        <input type="text" id="filter-fio">
                    </div>

                    <div class="filter-item">
                        <label for="filter-group">Группа</label>
                        <input type="text" id="filter-group" required minlength="5" maxlength="5" pattern="^[A-Za-z][1-9][0-9]{3}$">
                    </div>

                    <div class="filter-item">
                        <label for="filter-isu">ИСУ</label>
                        <input
                            type="text"
                            id="filter-isu"
                            inputmode="numeric"
                            maxlength="6"
                            pattern="[1-9][0-9]{5}"
                        >
                    </div>

                    <div class="filter-item">
                        <label for="filter-dormitory">Общежитие</label>
                        <input type="text" id="filter-dormitory" required min="1" max="100">
                    </div>

                    <div class="filter-item filter-checkbox">
                        <label class="checkbox-label">
                            <input type="checkbox" id="filter-foreign">
                            <span class="custom-checkbox"></span>
                            <span>Иностранец</span>
                        </label>
                    </div>

                    <div class="filter-item">
                        <label>Номер комнаты</label>

                        <div class="room-range">
                            <input type="number" id="filter-room-min" required min="1" max="99999" placeholder="От">
                            <input type="number" id="filter-room-max" required min="1" max="99999" placeholder="До">
                        </div>
                    </div>

                    <button type="button" id="btn-filter">
                        Применить
                    </button>

                    <button type="button" id="btn-reset-filter">
                        Сбросить
                    </button>
                </aside>

                <div class="students-table">
                    <div class="list-controls">
                        <label for="sort-by">Сортировка:</label>
                        <select id="sort-by">
                            <option value="isu">ИСУ</option>
                            <option value="fio">ФИО</option>
                            <option value="group">Группа</option>
                            <option value="dormNumber">Общежитие</option>
                            <option value="roomNumber">Комната</option>
                            <option value="dateInDorm">Дата заселения</option>
                        </select>
                        <select id="sort-dir" aria-label="Порядок сортировки">
                            <option value="asc">По возрастанию</option>
                            <option value="desc">По убыванию</option>
                        </select>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ИСУ</th>
                                <th>ФИО</th>
                                <th>Группа</th>
                                <th class="actions-col">Действия</th>
                            </tr>
                        </thead>

                        <tbody></tbody>
                    </table>
                    <div class="pagination">
                        <button id="page-prev" type="button">Назад</button>
                        <span id="page-number">Страница 1</span>
                        <button id="page-next" type="button">Далее</button>
                    </div>
                </div>

            </div>
        </section>

    <!-- Досье на студента -->
    <section id="dosie-students" class="hidden">
        <button id="btn-back">Назад</button>
        <h2>Досье студента</h2>

        <div id="dosie"></div>
    </section>
        
    <script src="js/api.js"></script>
    <script src="js/all_students.js"></script>
    <script src="js/form.js"></script>
    <script src="js/student.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
