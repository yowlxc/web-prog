services:
  backend:
    build: ./backend-java
    environment:
      DB_URL: jdbc:sqlite:/data/students.db
      JWT_SECRET: ${JWT_SECRET:?Скопируйте .env.example в .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - students-data:/data

  frontend:
    build: ./frontend-vue
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  students-data:
