<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление студентами</title>
    
    <!-- Подключаем стили (CSS) -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Добавляем иконку вкладки в виде котика, как требует задание -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <h1>Система заявок: Мониторинг студентов</h1>

    <!-- Список студентов -->
    <section id="list-students">
        <button id="btn-add">+ Добавить студента</button>

        <table>
            <thead>
                <tr>
                    <th>ИСУ</th>
                    <th>ФИО</th>
                    <th>Группа</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </section>

    <!-- Форма добавления/редакции студента -->
    <section id="form-students" class="hidden">
        <h2>Форма добавления/редакции студента</h2>
        
        <form>
            <label>ФИО</label>
            <input type="text" id="fio" required>

            <label>Группа</label>
            <input type="text" id="group" required>

            <label>ИСУ</label>
            <input type="number" id="isu" required>

            <label>Номер общежития</label>
            <input type="number" id="num-dorm" required>

            <label>Номер комнаты</label>
            <input type="number" id="num-room" required>

            <label>Дата заселения</label>
            <input type="date" id="date-in-dorm" required>

            <label>Иностранец</label>
            <input type="checkbox" id="no-rus" required>
            
            <label>Примечания</label>
            <textarea id="notes"></textarea>
            
            <button type="submit">Сохранить</button>
            <button type="button" id="btn-cancel">Отмена</button>
        </form>
    </section>

    <!-- Досье на студента -->
    <section id="dosie-students" class="hidden">
        <button id="btn-back">Назад</button>
        <h2>Досье студента</h2>

        <div id="dosie"></div>
    </section>

        
    <script src="js/storage.js"></script>
    <script src="js/all_students.js"></script>
    <script src="js/form.js"></script>
    <script src="js/student.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
