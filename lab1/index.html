<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление студентами</title>
    
    <!-- Подключаем стили (CSS) -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Добавляем иконку вкладки в виде котика, как требует задание -->
    <link rel="icon" type="image/png" href="favicon/cats.png">
</head>
<body>
    <h1>Система заявок: Мониторинг студентов</h1>

    <!-- Список студентов -->
    <section id="list-students">
        <div class="btn-add">
            <button id="btn-add">+ Добавить студента</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ИСУ</th>
                    <th>ФИО</th>
                    <th>Группа</th>
                    <th class="actions-col">Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>501606</th>
                    <th>ПОтёмкин Платон</th>
                    <th>P3224</th>
                    <th>Действия</th>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- Форма добавления/редакции студента -->
    <section id="form-students" class="hidden">
        <h2>Форма редактирования студента</h2>
        
        <form>
            <div class="form-data">
                <label>ФИО</label>
                <input type="text" id="fio" required minlength="2" maxlength="50" placeholder="Иванов Иван Иванович">
            </div>
            <div class="form-data">
                <label>Группа</label>
                <input type="text" id="group" required minlength="5" maxlength="5" pattern="[A-Z]\d{4}" placeholder="A1234">
            </div>
            <div class="form-data">
                <label>ИСУ</label>
                <input type="text" id="isu" required minlength="6" maxlength="6" pattern="\d{6}" placeholder="123456">
                <span id="isu-error"></span>
            </div>
            <div class="form-data">
                <label>Номер общежития</label>
                <input type="number" id="num-dorm" required min="1" max="100" placeholder="3">
            </div>
            <div class="form-data">
                <label>Номер комнаты</label>
                <input type="number" id="num-room" required min="1" max="99999" placeholder="804">
            </div>
            <div class="form-data">
                <label>Дата заселения</label>
                <input type="date" id="date-in-dorm" required min="1999-01-01" max="2026-09-17">
            </div>
            <div class="form-no-rus">
                <label>Иностранец</label>
                <input type="checkbox" id="no-rus">
            </div>
            <div class="form-notes">
                <label>Примечания</label>
                <textarea id="notes" maxlength="300" placeholder="Разбил окно"></textarea>
            </div>
            <div class="btn-form">
                <button type="submit">Сохранить</button>
                <button type="button" id="btn-cancel">Отмена</button>
            </div>
        </form>
    </section>

    <!-- Досье на студента -->
    <section id="dosie-students" class="hidden">
        <button id="btn-back">Назад</button>
        <h2>Досье студента</h2>

        <div id="dosie"></div>
    </section>

        
    <script src="js/storage.js"></script>
    <script src="js/all_students.js"></script>
    <script src="js/form.js"></script>
    <script src="js/student.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
